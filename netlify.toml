# Netlify deployment config — mirrors vercel.json so either host serves
# the site identically. The newsletter function lives in netlify/functions/.

[build]
  command = "node build.js"
  publish = "dist"

[build.environment]
  # Sanity project id is public (it appears in every content URL);
  # the write token is a secret and is set in the Netlify dashboard.
  SANITY_PROJECT_ID = "juhmq0dg"
  SANITY_DATASET = "production"

[functions]
  directory = "netlify/functions"

# Clean URLs.
[[redirects]]
  from = "/donate"
  to = "/donate.html"
  status = 200

[[redirects]]
  from = "/partners"
  to = "/partners.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

# The restyled About page shipped as /about (Aug 28); keep the preview path pointing at it.
[[redirects]]
  from = "/about-us-2"
  to = "/about"
  status = 301

[[redirects]]
  from = "/programs"
  to = "/programs.html"
  status = 200

# The restyled Programs page shipped as /programs (Aug 28); keep the preview path pointing at it.
[[redirects]]
  from = "/programs-2"
  to = "/programs"
  status = 301

[[redirects]]
  from = "/team"
  to = "/team.html"
  status = 200

# Preview of the reworked Team page (compare against /team before it replaces it)
[[redirects]]
  from = "/team-2"
  to = "/team2.html"
  status = 200

[[redirects]]
  from = "/our-team"
  to = "/team.html"
  status = 301

[[redirects]]
  from = "/staff"
  to = "/staff.html"
  status = 200

[[redirects]]
  from = "/training"
  to = "/training.html"
  status = 200

# Old program URLs — merged into /programs (2026-08)
[[redirects]]
  from = "/curriculum"
  to = "/programs"
  status = 301

[[redirects]]
  from = "/curriculum.html"
  to = "/programs"
  status = 301

[[redirects]]
  from = "/nutrition"
  to = "/programs#nutrition"
  status = 301

[[redirects]]
  from = "/nutrition.html"
  to = "/programs#nutrition"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
