# Netlify deployment config — mirrors vercel.json so either host serves
# the site identically. The newsletter function lives in netlify/functions/.

[build]
  command = "node build.js"
  publish = "dist"

[build.environment]
  # Sanity project id is public (it appears in every content URL);
  # the write token is a secret and is set in the Netlify dashboard.
  SANITY_PROJECT_ID = "juhmq0dg"
  SANITY_DATASET = "production"

[functions]
  directory = "netlify/functions"

# Clean URLs, same set as vercel.json rewrites.
[[redirects]]
  from = "/donate"
  to = "/donate.html"
  status = 200

[[redirects]]
  from = "/partners"
  to = "/partners.html"
  status = 200

[[redirects]]
  from = "/nutrition"
  to = "/nutrition.html"
  status = 200

[[redirects]]
  from = "/curriculum"
  to = "/curriculum.html"
  status = 200

[[redirects]]
  from = "/staff"
  to = "/staff.html"
  status = 200

[[redirects]]
  from = "/training"
  to = "/training.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
